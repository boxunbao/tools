<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"CSV 转 JSON 工具","url":"https://tools.boxunbao.com/csv-to-json/","applicationCategory":"DeveloperApplication","operatingSystem":"Any","inLanguage":"zh-CN","offers":{"@type":"Offer","price":"0","priceCurrency":"CNY"}}</script></head>
<body><div class="page"><nav class="topbar"><a class="brand" href="/"><span class="brand-mark">D</span><span>DevBox 工具箱</span></a><a class="back" href="/">返回首页</a></nav><header class="hero"><h1>CSV 转 JSON</h1><p>支持逗号、制表符和分号分隔，处理常见引号转义，转换过程在浏览器本地完成。</p></header>
<main><div class="toolbar"><select id="delimiter"><option value=",">逗号</option><option value="\t">Tab</option><option value=";">分号</option></select><label class="check"><input id="header" type="checkbox" checked>首行为表头</label><button class="btn primary" id="run">转换</button><button class="btn" id="copy">复制结果</button><button class="btn" id="sample">示例</button></div><div id="msg" class="msg"></div><section class="grid"><div class="panel"><div class="panel-head">CSV 输入</div><div class="panel-body"><textarea id="input" placeholder="name,email&#10;张三,dev@example.com"></textarea></div></div><div class="panel"><div class="panel-head">JSON 输出</div><div class="panel-body"><textarea id="output" readonly></textarea></div></div></section></main></div>
<script>
const $=id=>document.getElementById(id);function m(t,ok){$('msg').textContent=t;$('msg').className='msg '+(ok?'ok':'err')}
function parseCSV(text,delim){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&q&&n==='"'){cell+='"';i++}else if(c==='"'){q=!q}else if(c===delim&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(x=>x!==''))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>x!==''))rows.push(row);return rows}
$('run').onclick=()=>{try{const delim=$('delimiter').value==='\\t'?'\t':$('delimiter').value;const rows=parseCSV($('input').value,delim);if(!rows.length)throw new Error('没有可转换的数据');let data;if($('header').checked){const h=rows.shift();data=rows.map(r=>Object.fromEntries(h.map((k,i)=>[k||('col'+(i+1)),r[i]??''])))}else data=rows;$('output').value=JSON.stringify(data,null,2);m('转换成功，共 '+data.length+' 行',true)}catch(e){m('转换失败：'+e.message,false)}};
$('copy').onclick=async()=>{await navigator.clipboard.writeText($('output').value);m('已复制结果',true)};$('sample').onclick=()=>{$('input').value='name,email,age\n张三,dev@example.com,28\n李四,test@example.com,31';$('run').click()};
</script></body></html>
