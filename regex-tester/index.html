<body><div class="page"><nav class="topbar"><a class="brand" href="/"><span class="brand-mark">D</span><span>DevBox 工具箱</span></a><a class="back" href="/">返回首页</a></nav><header class="hero"><h1>正则测试器</h1><p>输入 JavaScript 正则表达式和测试文本，查看匹配位置、捕获组和替换预览。</p></header>
<main><div class="toolbar"><input id="pattern" class="field" placeholder="正则，例如 \\b\\w+@\\w+\\.com\\b"><input id="flags" class="field" value="g" placeholder="flags，例如 gim"><button class="btn primary" id="run">测试</button></div><div id="msg" class="msg"></div><section class="grid"><div class="panel"><div class="panel-head">测试文本</div><div class="panel-body stack"><textarea id="input" placeholder="输入需要匹配的文本"></textarea><input id="replace" class="field" placeholder="替换为，可选"></div></div><div class="panel"><div class="panel-head">匹配结果</div><div class="panel-body"><pre id="output" class="output"></pre></div></div></section></main></div>
<script>
const $=id=>document.getElementById(id);function m(t,ok){$('msg').textContent=t;$('msg').className='msg '+(ok?'ok':'err')}
$('run').onclick=()=>{try{let flags=$('flags').value||'';if(!flags.includes('g'))flags+='g';const re=new RegExp($('pattern').value,flags);const text=$('input').value;const rows=[];let match;while((match=re.exec(text))&&rows.length<1000){rows.push({match:match[0],index:match.index,groups:match.slice(1)});if(match[0]==='')re.lastIndex++}let out='匹配数量: '+rows.length+'\n\n'+JSON.stringify(rows,null,2);if($('replace').value)out+='\n\n替换预览:\n'+text.replace(re,$('replace').value);$('output').textContent=out;m('测试完成',true)}catch(e){m('正则无效：'+e.message,false)}};
</script></body></html>
