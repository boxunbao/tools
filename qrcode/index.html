<body><div class="page"><nav class="topbar"><a class="brand" href="/"><span class="brand-mark">D</span><span>DevBox 工具箱</span></a><a class="back" href="/">返回首页</a></nav><header class="hero"><h1>QR Code 生成器</h1><p>输入链接或文本生成二维码，支持调整尺寸和纠错等级，结果可下载为 PNG。</p></header>
<main><div class="toolbar"><label>尺寸 <input id="size" type="number" min="128" max="1024" value="256"></label><button class="btn primary" id="run">生成二维码</button><a class="btn" id="download" download="qrcode.png">下载</a></div><div id="msg" class="msg"></div><section class="grid"><div class="panel"><div class="panel-head">内容</div><div class="panel-body"><textarea id="input" placeholder="输入 URL、文本或其他内容">https://tools.boxunbao.com/</textarea></div></div><div class="panel"><div class="panel-head">二维码</div><div class="panel-body stack"><canvas id="canvas" width="256" height="256" class="preview-img"></canvas><p class="muted">离线生成 Version 2-L 二维码，适合不超过 32 字节的短文本或链接。</p></div></div></section></main></div>
<script>
const $=id=>document.getElementById(id);function m(t,ok){$('msg').textContent=t;$('msg').className='msg '+(ok?'ok':'err')}
const N=25,DATA=34,ECC=10;
function gfTables(){const exp=new Array(512),log=new Array(256);let x=1;for(let i=0;i<255;i++){exp[i]=x;log[x]=i;x<<=1;if(x&256)x^=0x11d}for(let i=255;i<512;i++)exp[i]=exp[i-255];return{exp,log}}
const GF=gfTables();
function mul(a,b){return a&&b?GF.exp[GF.log[a]+GF.log[b]]:0}
function generator(deg){let g=[1];for(let i=0;i<deg;i++){const next=new Array(g.length+1).fill(0);for(let j=0;j<g.length;j++){next[j]^=mul(g[j],GF.exp[i]);next[j+1]^=g[j]}g=next}return g}
function rs(data){const gen=generator(ECC),rem=new Array(ECC).fill(0);for(const d of data){const factor=d^rem.shift();rem.push(0);for(let i=0;i<ECC;i++)rem[i]^=mul(gen[i+1],factor)}return rem}
function bits(val,len,out){for(let i=len-1;i>=0;i--)out.push((val>>>i)&1)}
function dataCodewords(text){const bytes=[...new TextEncoder().encode(text)];if(bytes.length>32)throw new Error('当前离线版本最多支持 32 字节，中文约 10 个字');const out=[];bits(4,4,out);bits(bytes.length,8,out);bytes.forEach(b=>bits(b,8,out));bits(0,Math.min(4,DATA*8-out.length),out);while(out.length%8)out.push(0);const cw=[];for(let i=0;i<out.length;i+=8)cw.push(parseInt(out.slice(i,i+8).join(''),2));for(let pad=0;cw.length<DATA;pad++)cw.push(pad%2?0x11:0xec);return cw}
function emptyMatrix(){const mtx=Array.from({length:N},()=>Array(N).fill(null)),fixed=Array.from({length:N},()=>Array(N).fill(false));const set=(r,c,v)=>{if(r>=0&&r<N&&c>=0&&c<N){mtx[r][c]=v;fixed[r][c]=true}};function finder(r,c){for(let y=-1;y<=7;y++)for(let x=-1;x<=7;x++){const rr=r+y,cc=c+x;if(rr<0||rr>=N||cc<0||cc>=N)continue;const dark=(x>=0&&x<=6&&y>=0&&y<=6&&(x===0||x===6||y===0||y===6||(x>=2&&x<=4&&y>=2&&y<=4)));set(rr,cc,dark)}}finder(0,0);finder(0,N-7);finder(N-7,0);for(let i=8;i<N-8;i++){set(6,i,i%2===0);set(i,6,i%2===0)}for(let y=-2;y<=2;y++)for(let x=-2;x<=2;x++)set(18+y,18+x,Math.max(Math.abs(x),Math.abs(y))!==1);set(17,8,true);for(let i=0;i<9;i++){set(8,i,false);set(i,8,false);set(8,N-1-i,false);set(N-1-i,8,false)}return{mtx,fixed}}
function formatBits(){let data=(1<<3)|0,b=data<<10;for(let i=14;i>=10;i--)if((b>>i)&1)b^=0x537<<(i-10);return ((data<<10)|b)^0x5412}
function build(text){const code=dataCodewords(text),all=code.concat(rs(code)),stream=[];all.forEach(c=>bits(c,8,stream));const {mtx,fixed}=emptyMatrix();let i=0,up=true;for(let c=N-1;c>0;c-=2){if(c===6)c--;for(let k=0;k<N;k++){const r=up?N-1-k:k;for(let dc=0;dc<2;dc++){const cc=c-dc;if(!fixed[r][cc]){let v=stream[i++]||0;if((r+cc)%2===0)v^=1;mtx[r][cc]=!!v}}}up=!up}const f=formatBits();const a=[[8,0],[8,1],[8,2],[8,3],[8,4],[8,5],[8,7],[8,8],[7,8],[5,8],[4,8],[3,8],[2,8],[1,8],[0,8]],b=[[N-1,8],[N-2,8],[N-3,8],[N-4,8],[N-5,8],[N-6,8],[N-7,8],[8,N-8],[8,N-7],[8,N-6],[8,N-5],[8,N-4],[8,N-3],[8,N-2],[8,N-1]];for(let j=0;j<15;j++){const v=!!((f>>(14-j))&1);mtx[a[j][0]][a[j][1]]=v;mtx[b[j][0]][b[j][1]]=v}return mtx}
function draw(mtx,width){const c=$('canvas'),ctx=c.getContext('2d'),margin=4,cell=Math.floor(width/(N+margin*2)),size=cell*(N+margin*2);c.width=size;c.height=size;ctx.fillStyle='#fff';ctx.fillRect(0,0,size,size);ctx.fillStyle='#111';for(let r=0;r<N;r++)for(let col=0;col<N;col++)if(mtx[r][col])ctx.fillRect((col+margin)*cell,(r+margin)*cell,cell,cell)}
async function run(){const text=$('input').value.trim();if(!text){m('请输入二维码内容',false);return}try{draw(build(text),Math.min(1024,Math.max(128,parseInt($('size').value,10)||256)));$('download').href=$('canvas').toDataURL('image/png');m('二维码生成成功',true)}catch(e){m('生成失败：'+e.message,false)}}
$('run').onclick=run;window.addEventListener('load',run);
</script></body></html>
