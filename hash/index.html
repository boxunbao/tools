<body><div class="page"><nav class="topbar"><a class="brand" href="/"><span class="brand-mark">D</span><span>DevBox 工具箱</span></a><a class="back" href="/">返回首页</a></nav><header class="hero"><h1>Hash 计算工具</h1><p>本地计算文本或文件的 SHA 摘要，支持 SHA-1、SHA-256、SHA-384、SHA-512。</p></header>
<main><div class="toolbar"><select id="alg"><option>SHA-256</option><option>SHA-1</option><option>SHA-384</option><option>SHA-512</option></select><button class="btn primary" id="run">计算文本</button><button class="btn" id="copy">复制结果</button><button class="btn" id="clear">清空</button></div><div id="msg" class="msg"></div><section class="grid"><div class="panel"><div class="panel-head">输入</div><div class="panel-body stack"><textarea id="input" placeholder="输入需要计算 Hash 的文本"></textarea><input id="file" type="file"></div></div><div class="panel"><div class="panel-head">结果</div><div class="panel-body"><textarea id="output" readonly></textarea></div></div></section></main></div>
<script>
const $=id=>document.getElementById(id);function m(t,ok){$('msg').textContent=t;$('msg').className='msg '+(ok?'ok':'err')}
async function digest(buf){const h=await crypto.subtle.digest($('alg').value,buf);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}
$('run').onclick=async()=>{try{$('output').value=await digest(new TextEncoder().encode($('input').value));m('计算成功',true)}catch(e){m('计算失败：'+e.message,false)}};
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{$('output').value=await digest(await f.arrayBuffer());m('文件 Hash 计算成功',true)}catch(err){m('计算失败：'+err.message,false)}};
$('copy').onclick=async()=>{await navigator.clipboard.writeText($('output').value);m('已复制结果',true)};$('clear').onclick=()=>{$('input').value='';$('output').value='';$('file').value='';$('msg').className='msg'};
</script></body></html>
