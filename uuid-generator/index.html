<body><div class="page"><nav class="topbar"><a class="brand" href="/"><span class="brand-mark">D</span><span>DevBox 工具箱</span></a><a class="back" href="/">返回首页</a></nav><header class="hero"><h1>UUID 生成器</h1><p>使用浏览器 Crypto API 批量生成 UUID v4，适合测试数据、临时 ID 和配置标识。</p></header>
<main><div class="toolbar"><button class="btn primary" id="gen">生成</button><button class="btn" id="copy">复制结果</button><button class="btn" id="clear">清空</button></div><div id="msg" class="msg"></div><section class="grid"><div class="panel"><div class="panel-head">选项</div><div class="panel-body stack"><label>数量<input id="count" type="number" min="1" max="200" value="10"></label><label class="check"><input id="upper" type="checkbox">大写</label><label class="check"><input id="plain" type="checkbox">去掉连字符</label></div></div><div class="panel"><div class="panel-head">结果</div><div class="panel-body"><textarea id="output" readonly></textarea></div></div></section></main></div>
<script>
const $=id=>document.getElementById(id);function m(t,ok){$('msg').textContent=t;$('msg').className='msg '+(ok?'ok':'err')}
function uuid(){return crypto.randomUUID?crypto.randomUUID():'10000000-1000-4000-8000-100000000000'.replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16))}
$('gen').onclick=()=>{let n=Math.min(200,Math.max(1,parseInt($('count').value,10)||1));let arr=Array.from({length:n},()=>uuid());if($('plain').checked)arr=arr.map(x=>x.replace(/-/g,''));if($('upper').checked)arr=arr.map(x=>x.toUpperCase());$('output').value=arr.join('\n');m('已生成 '+n+' 个 UUID',true)};
$('copy').onclick=async()=>{await navigator.clipboard.writeText($('output').value);m('已复制结果',true)};$('clear').onclick=()=>{$('output').value='';$('msg').className='msg'};$('gen').click();
</script></body></html>
