<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URL 编码解码工具 - DevBox</title>
<meta name="description" content="免费在线 URL 编码解码工具，支持 encodeURIComponent、decodeURIComponent 和查询参数解析。">
<meta name="keywords" content="URL编码,URL解码,encodeURIComponent,decodeURIComponent,查询参数解析">
<link rel="icon" href="/images/favicon.ico"><link rel="canonical" href="https://tools.boxunbao.com/url-encode/">
<meta property="og:type" content="website"><meta property="og:title" content="URL 编码解码工具"><meta property="og:description" content="URL 编码、解码和查询参数解析。"><meta name="twitter:card" content="summary">
<link rel="stylesheet" href="/shared/tool.css">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"URL 编码解码工具","url":"https://tools.boxunbao.com/url-encode/","applicationCategory":"DeveloperApplication","operatingSystem":"Any","inLanguage":"zh-CN","offers":{"@type":"Offer","price":"0","priceCurrency":"CNY"}}</script>
</head>
<body><div class="page"><nav class="topbar"><a class="brand" href="/"><span class="brand-mark">D</span><span>DevBox 工具箱</span></a><a class="back" href="/">返回首页</a></nav>
<header class="hero"><h1>URL 编码解码工具</h1><p>对 URL、路径片段、查询参数做编码解码，并可把查询字符串解析为 JSON。</p></header>
<main><div class="toolbar"><button class="btn primary" id="enc">编码</button><button class="btn" id="dec">解码</button><button class="btn" id="parse">解析 Query</button><button class="btn" id="copy">复制结果</button><button class="btn" id="clear">清空</button></div><div id="msg" class="msg"></div>
<section class="grid"><div class="panel"><div class="panel-head">输入</div><div class="panel-body"><textarea id="input" placeholder="输入 URL、文本或 ?a=1&b=中文"></textarea></div></div><div class="panel"><div class="panel-head">结果</div><div class="panel-body"><textarea id="output" readonly></textarea></div></div></section></main></div>
<script>
const $=id=>document.getElementById(id);function m(t,ok){$('msg').textContent=t;$('msg').className='msg '+(ok?'ok':'err')}
$('enc').onclick=()=>{$('output').value=encodeURIComponent($('input').value);m('编码成功',true)};
$('dec').onclick=()=>{try{$('output').value=decodeURIComponent($('input').value);m('解码成功',true)}catch(e){m('URL 编码格式无效',false)}};
$('parse').onclick=()=>{try{let s=$('input').value.trim();let q=s.includes('?')?s.slice(s.indexOf('?')+1):s;q=q.split('#')[0];const o={};new URLSearchParams(q).forEach((v,k)=>{if(k in o)o[k]=[].concat(o[k],v);else o[k]=v});$('output').value=JSON.stringify(o,null,2);m('解析成功',true)}catch(e){m('解析失败：'+e.message,false)}};
$('copy').onclick=async()=>{await navigator.clipboard.writeText($('output').value);m('已复制结果',true)};$('clear').onclick=()=>{$('input').value='';$('output').value='';$('msg').className='msg'};
</script></body></html>
