<body><div class="page"><nav class="topbar"><a class="brand" href="/"><span class="brand-mark">D</span><span>DevBox 工具箱</span></a><a class="back" href="/">返回首页</a></nav><header class="hero"><h1>JSON 转 TypeScript</h1><p>粘贴 JSON 示例，自动推导 TypeScript interface。适合接口响应、Mock 数据和临时类型草稿。</p></header>
<main><div class="toolbar"><input id="name" class="field" value="RootObject" placeholder="根接口名称"><button class="btn primary" id="run">生成类型</button><button class="btn" id="copy">复制结果</button><button class="btn" id="sample">示例</button></div><div id="msg" class="msg"></div><section class="grid"><div class="panel"><div class="panel-head">JSON 输入</div><div class="panel-body"><textarea id="input" placeholder='{"id":1,"name":"DevBox","tags":["tool"]}'></textarea></div></div><div class="panel"><div class="panel-head">TypeScript 输出</div><div class="panel-body"><textarea id="output" readonly></textarea></div></div></section></main></div>
<script>
const $=id=>document.getElementById(id);function m(t,ok){$('msg').textContent=t;$('msg').className='msg '+(ok?'ok':'err')}
function pascal(s){return String(s||'Item').replace(/[^a-zA-Z0-9]+(.)/g,(_,c)=>c.toUpperCase()).replace(/^[a-z]/,c=>c.toUpperCase()).replace(/[^a-zA-Z0-9]/g,'')||'Item'}
function infer(v,name,defs){if(v===null)return 'null';if(Array.isArray(v)){if(!v.length)return 'unknown[]';const types=[...new Set(v.map(x=>infer(x,name+'Item',defs)))];return '('+types.join(' | ')+')[]'}if(typeof v==='object'){const n=pascal(name);let lines=Object.keys(v).map(k=>'  '+(/^[A-Za-z_$][\w$]*$/.test(k)?k:JSON.stringify(k))+': '+infer(v[k],n+pascal(k),defs)+';');defs.push('interface '+n+' {\n'+lines.join('\n')+'\n}');return n}return typeof v}
$('run').onclick=()=>{try{let obj=JSON.parse($('input').value);if(Array.isArray(obj))obj=obj[0]||{};const defs=[];infer(obj,$('name').value||'RootObject',defs);$('output').value=[...new Set(defs.reverse())].join('\n\n');m('生成成功',true)}catch(e){m('JSON 解析失败：'+e.message,false)}};
$('copy').onclick=async()=>{await navigator.clipboard.writeText($('output').value);m('已复制结果',true)};$('sample').onclick=()=>{$('input').value=JSON.stringify({id:1,name:'DevBox',active:true,tags:['json','typescript'],owner:{name:'张三',email:'dev@example.com'}},null,2);$('run').click()};
</script></body></html>
