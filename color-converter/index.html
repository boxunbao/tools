<main><div class="toolbar"><input id="input" class="field" value="#3b5fdb"><button class="btn primary" id="run">转换</button><button class="btn" id="copy">复制结果</button></div><div id="msg" class="msg"></div><section class="grid"><div class="panel"><div class="panel-head">预览</div><div class="panel-body stack"><input id="picker" type="color" value="#3b5fdb"><div id="swatch" class="swatch"></div></div></div><div class="panel"><div class="panel-head">结果</div><div class="panel-body"><pre id="output" class="output"></pre></div></div></section></main></div>
<script>
const $=id=>document.getElementById(id);function m(t,ok){$('msg').textContent=t;$('msg').className='msg '+(ok?'ok':'err')}
function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;let max=Math.max(r,g,b),min=Math.min(r,g,b),h,s,l=(max+min)/2;if(max===min){h=s=0}else{let d=max-min;s=l>.5?d/(2-max-min):d/(max+min);h=max===r?(g-b)/d+(g<b?6:0):max===g?(b-r)/d+2:(r-g)/d+4;h*=60}return [Math.round(h),Math.round(s*100),Math.round(l*100)]}
function parse(v){v=v.trim();let m;if(/^#?[0-9a-f]{3,8}$/i.test(v)){v=v.replace('#','');if(v.length===3)v=v.split('').map(c=>c+c).join('');return [parseInt(v.slice(0,2),16),parseInt(v.slice(2,4),16),parseInt(v.slice(4,6),16)]}if(m=v.match(/rgba?\(([^)]+)\)/i))return m[1].split(',').slice(0,3).map(x=>parseFloat(x));if(m=v.match(/hsl\(([^)]+)\)/i)){let [h,s,l]=m[1].split(',').map(x=>parseFloat(x));s/=100;l/=100;let a=s*Math.min(l,1-l);let f=n=>{let k=(n+h/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1))))};return [f(0),f(8),f(4)]}throw new Error('请输入 HEX、RGB 或 HSL')}
function render(){try{const [r,g,b]=parse($('input').value);const hex='#'+[r,g,b].map(x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,'0')).join('');const [h,s,l]=rgbToHsl(r,g,b);$('swatch').style.background=hex;$('picker').value=hex;$('output').textContent=['HEX: '+hex.toUpperCase(),'RGB: rgb('+[r,g,b].map(Math.round).join(', ')+')','HSL: hsl('+h+', '+s+'%, '+l+'%)'].join('\n');m('转换成功',true)}catch(e){m(e.message,false)}}
$('run').onclick=render;$('picker').oninput=e=>{$('input').value=e.target.value;render()};$('copy').onclick=async()=>{await navigator.clipboard.writeText($('output').textContent);m('已复制结果',true)};render();
