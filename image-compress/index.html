<body><div class="page"><nav class="topbar"><a class="brand" href="/"><span class="brand-mark">D</span><span>DevBox 工具箱</span></a><a class="back" href="/">返回首页</a></nav><header class="hero"><h1>图片压缩工具</h1><p>选择图片后在浏览器本地压缩，可设置输出格式、质量和最大宽度，不上传原图。</p></header>
<main><div class="toolbar"><select id="type"><option value="image/webp">WebP</option><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option></select><label>质量 <input id="quality" type="number" min="0.1" max="1" step="0.05" value="0.8"></label><label>最大宽度 <input id="maxw" type="number" value="1600"></label><button class="btn primary" id="run">压缩</button><a class="btn" id="download" download="compressed.webp">下载</a></div><div id="msg" class="msg"></div><section class="grid"><div class="panel"><div class="panel-head">原图</div><div class="panel-body stack"><input id="file" type="file" accept="image/*"><div id="info" class="muted">请选择图片</div><img id="before" class="preview-img" alt=""></div></div><div class="panel"><div class="panel-head">压缩结果</div><div class="panel-body stack"><div id="outInfo" class="muted">结果显示在这里</div><img id="after" class="preview-img" alt=""></div></div></section></main></div>
<script>
const $=id=>document.getElementById(id);let file,img=new Image();function m(t,ok){$('msg').textContent=t;$('msg').className='msg '+(ok?'ok':'err')}function size(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(2)+' MB'}
$('file').onchange=e=>{file=e.target.files[0];if(!file)return;const url=URL.createObjectURL(file);img.onload=()=>{$('before').src=url;$('info').textContent='原始大小 '+size(file.size)+'，尺寸 '+img.naturalWidth+'×'+img.naturalHeight;m('图片已载入',true)};img.src=url};
$('run').onclick=()=>{if(!file){m('请先选择图片',false);return}const maxw=parseInt($('maxw').value,10)||img.naturalWidth;const scale=Math.min(1,maxw/img.naturalWidth);const w=Math.round(img.naturalWidth*scale),h=Math.round(img.naturalHeight*scale);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);c.toBlob(blob=>{if(!blob){m('压缩失败',false);return}const url=URL.createObjectURL(blob);$('after').src=url;$('download').href=url;$('download').download='compressed.'+($('type').value.includes('webp')?'webp':$('type').value.includes('png')?'png':'jpg');$('outInfo').textContent='压缩后 '+size(blob.size)+'，尺寸 '+w+'×'+h+'，减少 '+Math.max(0,100-blob.size/file.size*100).toFixed(1)+'%';m('压缩完成',true)},$('type').value,Number($('quality').value)||.8)};
</script></body></html>
